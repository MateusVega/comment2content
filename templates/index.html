<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}" />
		<link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='favicon_io/apple-touch-icon.png') }}" />
		<link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='favicon_io/android-chrome-192x192.png') }}" />
		<link rel="icon" type="image/png" sizes="512x512" href="{{ url_for('static', filename='favicon_io/android-chrome-512x512.png') }}" />
		<link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon_io/favicon-32x32.png') }}" />
		<link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='favicon_io/favicon-16x16.png') }}" />
		<link rel="manifest" href="{{ url_for('static', filename='favicon_io/site.webmanifest') }}" />
		<link rel="icon" href="{{ url_for('static', filename='favicon_io/favicon.ico') }}" type="image/x-icon" />
		<title>Comment2Content</title>
	</head>
	<body class="min-h-screen bg-gradient-to-br from-red-50 to-gray-100 flex items-center justify-center">
		<main class="w-full max-w-6xl bg-white rounded-2xl shadow-xl p-10 flex flex-col gap-10">
			<header class="flex flex-col gap-4 text-center">
				<h1 class="text-5xl font-extrabold text-red-600">Discover what your subscribers want to watch</h1>
				<p class="text-gray-600 text-lg">Input the <strong>URL</strong> of your video and analyze what your audience really wants based on YouTube comments.</p>
			</header>
			<section class="flex flex-col sm:flex-row gap-4 justify-center items-center">
				<input
					class="w-full sm:w-2/3 border border-gray-300 rounded-xl px-4 py-3 text-center focus:outline-none focus:ring-2 focus:ring-red-500 transition"
					type="text"
					id="url"
					autocomplete="off"
					placeholder="https://www.youtube.com/watch?v=..."
				/>
				<button
					id="submitButton"
					onclick="submitForm()"
					class="bg-red-600 hover:bg-red-700 disabled:bg-red-700 disabled:cursor-not-allowed disabled:opacity-70 active:scale-95 transition text-white font-bold px-8 py-3 rounded-xl shadow-md"
				>
					Discover
				</button>
				<button
					id="cancelButton"
					onclick="stopOperation()"
					style="display: none"
					class="bg-red-600 hover:bg-red-700 disabled:bg-red-700 disabled:cursor-not-allowed disabled:opacity-70 active:scale-95 transition text-white font-bold px-8 py-3 rounded-xl shadow-md"
				>
					Cancel
				</button>
			</section>
			<section id="status" class="flex flex-col gap-3">
				<div class="w-full bg-gray-200 rounded-full overflow-hidden h-6">
					<div id="progress-done" class="h-full w-0 bg-red-600 text-white text-sm font-bold flex items-center justify-center transition-all duration-500"></div>
				</div>
				<p id="status_text" class="text-center text-gray-500 animate-pulse">Waiting for url...</p>
			</section>
			<section id="result" class="grid grid-cols-1 md:grid-cols-2 gap-8">
				<section class="flex flex-col gap-4">
					<h2 class="text-3xl font-bold text-red-600">Summary</h2>

					<iframe class="w-full aspect-video rounded-xl shadow" id="iframe" src="" title="YouTube video player" frameborder="0" allowfullscreen> </iframe>

					<div class="bg-gray-50 rounded-xl p-4 shadow-sm flex flex-col gap-1">
						<p id="video_title" class="text-lg font-semibold"></p>
						<p id="channel_title" class="text-red-600 font-bold"></p>
						<p id="time_spent" class="text-sm text-gray-500"></p>
						<p id="total_comments_fetched" class="text-sm text-gray-500"></p>
						<p id="ideas_found" class="text-sm text-gray-500"></p>
					</div>
				</section>

				<section id="comments_section" class="flex flex-col gap-4 bg-gray-50 rounded-xl p-6 shadow-sm">
					<h2 class="text-3xl font-bold text-red-600">Suggestions</h2>
					<p class="text-gray-600">Raw comments: <span id="comments_amount" class="font-bold text-red-600">0</span></p>
					<ul id="comments" class="flex flex-col gap-4"></ul>
				</section>
			</section>
		</main>

		<script>
			const cancel_button = document.getElementById("cancelButton");

			let progress = 0;
			let progressInterval = null;
			let isCancelled = false;

			let fetchController = null;

			function update_bar(target) {
				if (isCancelled) return;

				const bar = document.getElementById("progress-done");
				const status_text = document.getElementById("status_text");

				clearInterval(progressInterval);
				progressInterval = setInterval(() => {
					if (isCancelled || progress >= target || progress >= 100) {
						clearInterval(progressInterval);
						if (progress >= 100) bar.classList.add("rounded-lg");
						return;
					}

					progress++;
					bar.style.width = progress + "%";
					bar.textContent = progress + "%";

					if (progress == 5) status_text.textContent = "Analyzing video...";
					else if (progress == 10) status_text.textContent = "Getting channel info...";
					else if (progress == 15) status_text.textContent = "Looking for existing results...";
					else if (progress == 20) status_text.textContent = "Reading audience comments...";
					else if (progress > 20 && progress < 90) status_text.textContent = "Analyzing comments with AI...";
					else if (progress == 90) status_text.textContent = "Preparing insights...";
					else if (progress == 100) {
						status_text.textContent = "Ready";
						cancel_button.style.display = "none";
					}
				}, 15);
			}

			function show_comments(data) {
				const comments_section_obj = document.getElementById("comments_section");
				const comments_amount_obj = document.getElementById("comments_amount");
				const comments_obj = document.getElementById("comments");

				comments_amount_obj.textContent = data.count;
				comments_obj.textContent = "";

				data.comments.forEach((element) => {
					date = new Date(element.published_at);

					formated_date = date.toLocaleString("en-US", {
						dateStyle: "medium",
						timeStyle: "short",
					});

					comments_obj.innerHTML += `
			                     <div class="comment bg-white rounded-lg border border-gray-200 p-4 space-y-2">
			                         <p class="text-sm text-gray-500"><strong class="font-medium text-gray-700">Likes:</strong> ${element.likes}</p>
			                         <p class="text-sm text-gray-500"><strong class="font-medium text-gray-700">Publicado em:</strong> ${formated_date}</p>
			                         <p class="text-gray-800 text-sm leading-relaxed">${element.text}</p>
			                     </div>
			                 `;
				});

				if (data.comments.length == 0) {
					comments_obj.innerHTML += "<p class='text-gray-800 text-sm leading-relaxed'>No ideas found from the comments.</p>";
				}

				document.getElementById("iframe").src = `https://www.youtube.com/embed/${data.video_id}`;
				document.getElementById("video_title").textContent = data.title;
				document.getElementById("channel_title").textContent = data.channel;
				document.getElementById("time_spent").textContent = `Time spent: ${data.time_spent} seconds.`;
				document.getElementById("total_comments_fetched").textContent = `Total comments analyzed: ${data.total_comments_fetched}.`;
				document.getElementById("ideas_found").textContent = `Ideas found: ${data.count}.`;

				document.getElementById("submitButton").disabled = false;
			}

			function hide_all() {
				document.getElementById("comments_amount").textContent = "0";
				document.getElementById("comments").innerHTML = "";
				document.getElementById("iframe").src = "";
				document.getElementById("video_title").textContent = "";
				document.getElementById("channel_title").textContent = "";
				document.getElementById("time_spent").textContent = "";
				document.getElementById("total_comments_fetched").textContent = "";
				document.getElementById("ideas_found").textContent = "";
			}

			function fetchResults(url_value) {
				fetchController = new AbortController();

				fetch("{{ url_for('process_api') }}", {
					method: "POST",
					headers: { "Content-Type": "application/json" },
					body: JSON.stringify({ url: url_value }),
					signal: fetchController.signal,
				})
					.then(async (res) => {
						const data = await res.json();
						if (!res.ok) {
							alert(data.error || "Erro inesperado");
							return;
						}
						if (!isCancelled) show_comments(data);
					})
					.catch((err) => {
						if (err.name !== "AbortError") {
							alert("Erro de conexão com o servidor");
							console.error(err);
						}
					});
			}

			function submitForm() {
				isCancelled = false;
				document.getElementById("submitButton").disabled = true;
				const url_value = document.getElementById("url").value;
				if (!url_value) return;
				fetchResults(url_value);
				progress = 0;
				hide_all();
				const bar = document.getElementById("progress-done");
				bar.style.width = "0%";
				bar.textContent = "0%";
				bar.classList.remove("rounded-lg");
				cancel_button.style.display = "inline-block";
			}

			function stopOperation() {
				isCancelled = true;

				clearInterval(progressInterval);

				if (fetchController) {
					fetchController.abort();
					fetchController = null;
				}

				progress = 0;
				document.getElementById("progress-done").style.width = "0%";
				document.getElementById("progress-done").textContent = "Cancelled";
				document.getElementById("submitButton").disabled = false;
				hide_all();
				cancel_button.style.display = "none";

				document.getElementById("status_text").textContent = "Waiting for url...";
			}

			const sse = new EventSource("/stream");

			sse.addEventListener("status", (e) => {
				update_bar(e.data);
			});
		</script>
	</body>
</html>
